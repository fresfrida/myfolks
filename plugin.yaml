name: myfolks
version: 0.0.1
description: Exact, private recall of your people through /contacts, with no AI in the path.
requires_hermes: ">=0.23.1"
python_dependencies:
  - "cryptography>=3.4.8,<51"
provides_tools:
  - myfolks_contacts
provides_hooks:
  - pre_tool_call
config_schema:
  ai_tool:
    type: bool
    default: false
    description: Let Hermes's AI look up matching lines and save new ones. Off by default.
  shared_people:
    type: list
    default: []
    description: 'People who may use MyFolks in a private chat, one per line, as platform:sender-id:access. Access is read, or add to also save lines. Example: telegram:12345:read'
